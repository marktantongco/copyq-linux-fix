# ==============================================================================
# Ubuntu 26.04 LTS — Wayland Environment Configuration
# ==============================================================================
# Placement: ~/.config/environment.d/wayland.conf
# Loaded by systemd at login. Requires relogin to take effect.
#
# Strategy:
#   Modern apps (GTK4, Qt6, Electron) -> native Wayland (best performance)
#   Older apps (Qt5, GTK2) -> XWayland bridge (via fallback)
#   CopyQ specifically -> XWayland only (see Flatpak override)
# ==============================================================================

# GTK Applications
GDK_BACKEND=wayland

# Qt Applications (Wayland first, fallback to X11/XWayland)
QT_QPA_PLATFORM=wayland;xcb

# SDL Applications
SDL_VIDEODRIVER=wayland

# Electron / Chromium
ELECTRON_OZONE_PLATFORM_HINT=wayland

# Firefox
MOZ_ENABLE_WAYLAND=1

# Java / AWT
_AWT_NONPARENT_WINDOWS=1
_JAVA_AWT_WM_NONREPARENTING=1

# WebKitGTK
WEBKIT_DISABLE_DMABUF_RENDERER=0
