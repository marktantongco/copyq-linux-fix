# ==============================================================================
# Ubuntu 26.04 LTS — Wayland Environment Configuration
# ==============================================================================
# Placement: ~/.config/environment.d/wayland.conf
# Loaded by systemd at login. Requires relogin to take effect.
#
# NOTE: CopyQ does NOT need these variables. CopyQ v14+ uses its GNOME Shell
# extension for clipboard monitoring and runs natively on Wayland.
# These are general-purpose Wayland defaults for OTHER applications.
# ==============================================================================

# GTK Applications
GDK_BACKEND=wayland

# Qt Applications (Wayland first, fallback to X11/XWayland)
QT_QPA_PLATFORM=wayland;xcb

# SDL Applications
SDL_VIDEODRIVER=wayland

# Electron / Chromium
ELECTRON_OZONE_PLATFORM_HINT=wayland

# Firefox
MOZ_ENABLE_WAYLAND=1
